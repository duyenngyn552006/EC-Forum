{% extends "base.html" %}
{% block title %}{% if object %}Sửa chuyên mục{% else %}Thêm chuyên mục{% endif %}{% endblock %}
{% block content %}
<div class="card">
    <h1>{% if object %}Sửa chuyên mục "{{ object.name }}"{% else %}Thêm chuyên mục{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Lưu</button>
        <a class="btn btn-secondary" href="{% url 'forum:category_list' %}">Hủy</a>
    </form>
</div>
{% endblock %}
