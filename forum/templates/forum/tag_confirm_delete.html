{% extends "base.html" %}
{% block title %}Xóa thẻ{% endblock %}
{% block content %}
<div class="card">
    <h1>Xác nhận xóa thẻ "{{ object.name }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Xóa</button>
        <a class="btn btn-secondary" href="{% url 'forum:tag_list' %}">Hủy</a>
    </form>
</div>
{% endblock %}
