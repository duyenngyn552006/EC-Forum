{% extends "base.html" %}
{% block title %}Tạo nhóm{% endblock %}
{% block content %}
<div class="card">
    <h1>Tạo nhóm mới</h1>
    <p><em>Lưu ý: nếu bạn là sinh viên, yêu cầu tạo nhóm sẽ cần Giáo vụ Khoa duyệt trước khi hoạt động.</em></p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Gửi yêu cầu</button>
    </form>
</div>
{% endblock %}
