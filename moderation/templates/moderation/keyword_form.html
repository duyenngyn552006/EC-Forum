{% extends "base.html" %}
{% block title %}{% if object %}Sửa từ khóa{% else %}Thêm từ khóa{% endif %}{% endblock %}
{% block content %}
<div class="card">
    <h1>{% if object %}Sửa từ khóa "{{ object.keyword }}"{% else %}Thêm từ khóa nhạy cảm{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Lưu</button>
        <a class="btn btn-secondary" href="{% url 'moderation:keyword_list' %}">Hủy</a>
    </form>
</div>
{% endblock %}
