{% extends "base.html" %}
{% block title %}Chỉnh sửa hồ sơ{% endblock %}
{% block content %}
<div class="card">
    <h1>Chỉnh sửa hồ sơ</h1>

        {% csrf_token %}

    </form>
</div>
{% endblock %}
